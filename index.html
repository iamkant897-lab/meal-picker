<meta property="og:title" content="오늘 뭐 먹지? 🍓">
<meta property="og:description" content="와이프 최애 위주 메뉴 추천 + 수원 맛집 + 룰렛">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 한 손 세로 스크롤 한 줄 흐름. 질문 칩 → 후보 3장 → 식당 카드 + 지도. 딸기(포인트)와 귤(보조) 색. */
:root{
  --bg:#fff8f6; --surface:#ffffff; --ink:#3a2a2e; --muted:#8a6f75; --line:#f1dcdc;
  --berry:#e8445a; --berry-soft:#ffe3e7; --tang:#f59a23; --tang-soft:#fff0d9;
  --ok:#2f9e6a; --ok-soft:#e1f5ea; --warn:#b7791f; --warn-soft:#fdf1d8;
  --shadow:0 6px 18px rgba(232,68,90,.10);
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1e1619; --surface:#2a1f23; --ink:#f6e9ec; --muted:#bfa3aa; --line:#43323a;
  --berry:#ff6b80; --berry-soft:#4a2530; --tang:#ffb454; --tang-soft:#47331c;
  --ok:#5fd39b; --ok-soft:#1d3a2c; --warn:#f0c060; --warn-soft:#3f3218;
  --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1e1619; --surface:#2a1f23; --ink:#f6e9ec; --muted:#bfa3aa; --line:#43323a;
  --berry:#ff6b80; --berry-soft:#4a2530; --tang:#ffb454; --tang-soft:#47331c;
  --ok:#5fd39b; --ok-soft:#1d3a2c; --warn:#f0c060; --warn-soft:#3f3218;
  --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2.1rem;line-height:1.1}
h2{font-size:1.35rem}
h3{font-size:1.15rem}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.berry{display:inline-block;transform:rotate(-8deg)}
section.panel{background:var(--surface);border-radius:20px;padding:18px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.q{display:flex;flex-direction:column;gap:8px}
.q-label{font-family:var(--f-display);font-size:1.02rem}
.q-label small{font-family:var(--f-body);color:var(--muted);font-size:.8rem;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:.9rem;
  padding:6px 11px;border-radius:999px;cursor:pointer;transition:transform .12s,background .12s,border-color .12s}
.chip:hover{border-color:var(--berry)}
.chip[aria-pressed="true"]{background:var(--berry);border-color:var(--berry);color:#fff}
.chip:active{transform:scale(.95)}
button:focus-visible,a:focus-visible{outline:3px solid var(--tang);outline-offset:2px}
.actions{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;max-width:560px;margin:0 auto}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--bg);border-top:1px solid var(--line);
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.status{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:.84rem;color:var(--muted)}
.rt{font-weight:700;color:var(--tang)}.rt.none{color:var(--muted);font-weight:400}
.st{font-weight:700}.st.open{color:var(--ok)}.st.brk{color:var(--warn)}.st.shut{color:var(--muted)}
details.more summary{cursor:pointer;font-size:.84rem;color:var(--muted)}
details.more[open]{display:flex;flex-direction:column;gap:8px}
details.more>*+*{margin-top:8px}
.toggle{display:flex;align-items:center;gap:8px;font-size:.88rem}

.btn{appearance:none;border:none;font:inherit;font-family:var(--f-display);font-size:1.08rem;padding:13px 10px;border-radius:16px;cursor:pointer;
  background:var(--berry);color:#fff;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.alt{background:var(--tang-soft);color:var(--ink);border:1.5px dashed var(--tang)}
.btn.small{font-size:.9rem;padding:8px 12px;border-radius:12px}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
.recent{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--tang-soft);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:.8rem}
.linkish{background:none;border:none;color:var(--muted);text-decoration:underline;font:inherit;font-size:.8rem;cursor:pointer;padding:0}
/* roulette */
.roulette{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0}
.slot{font-family:var(--f-display);font-size:2rem;min-height:3rem;display:flex;align-items:center;gap:10px;color:var(--berry)}
.slot.spin{animation:wob .12s infinite alternate}
@keyframes wob{from{transform:translateY(-2px)}to{transform:translateY(2px)}}
/* candidates */
.cands{display:grid;gap:10px}
.cand{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:left;width:100%;
  appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:12px 14px;border-radius:16px;cursor:pointer}
.cand:hover{border-color:var(--berry)}
.cand.on{border-color:var(--berry);background:var(--berry-soft)}
.cand .ico{font-size:1.9rem;line-height:1}
.cand .nm{font-family:var(--f-display);font-size:1.15rem}
.cand .heart{font-family:var(--f-body);font-size:.72rem;color:var(--berry);background:var(--berry-soft);border-radius:99px;padding:1px 7px;vertical-align:middle;white-space:nowrap}
.cand .heart.tr{color:var(--tang);background:var(--tang-soft)}.cand .heart.td{color:var(--ok);background:var(--ok-soft)}
.adv summary{cursor:pointer;font-family:var(--f-display);padding:4px 0}.adv summary small{color:var(--muted);font-family:var(--f-body);font-size:.8rem;margin-left:6px}.advbody{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.wx{font-size:.85rem;color:var(--muted);margin:-4px 0 10px}
.card button.go{display:block;width:100%;margin:10px 0 2px;background:var(--berry);color:#fff;border:0;border-radius:12px;padding:11px 14px;font-family:var(--f-display);font-size:1rem;cursor:pointer}
.morefind{margin-top:16px;padding-top:14px;border-top:1.5px dashed var(--line)}.morefind .q-label{margin-bottom:8px}
.morebox{margin-top:12px}.morebox summary{cursor:pointer;font-family:var(--f-display);padding:6px 0}.morebox summary small{color:var(--muted);font-family:var(--f-body);font-size:.78rem;margin-left:6px}.mrow{display:flex;gap:8px;align-items:flex-start;margin-top:8px}.mg{flex:0 0 3.2em;font-size:.82rem;color:var(--muted);padding-top:8px}.reroll{margin-top:10px;width:100%}
.cand .why{font-size:.82rem;color:var(--muted);min-width:0}
.rank{font-family:var(--f-display);color:var(--berry);font-size:.95rem}
/* restaurants */
.rlist{display:grid;gap:12px}
.card{border:1.5px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.far{opacity:.72}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-h h3{min-width:0}
.badge{flex:none;font-size:.75rem;border-radius:999px;padding:2px 9px;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.menu{font-size:.92rem}
.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:.84rem;color:var(--muted)}
.meta dt{color:var(--muted)}
.meta dd{margin:0;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.meta dd.nocoord{color:var(--warn)}
.note{font-size:.88rem;background:var(--berry-soft);border-radius:12px;padding:6px 10px}
.vnote{font-size:.76rem;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a,.links button{font:inherit;font-size:.85rem;text-decoration:none;border-radius:12px;padding:7px 11px;border:1.5px solid var(--line);color:var(--ink);background:transparent;cursor:pointer}
.links a.kakao{background:#fee500;border-color:#fee500;color:#191600}
.links a.naver{background:#03c75a;border-color:#03c75a;color:#fff}
#map{height:260px;border-radius:16px;overflow:hidden;border:1.5px solid var(--line);z-index:0}
.mapbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.hint{font-size:.82rem;color:var(--muted)}
.dessert{font-size:.85rem;color:var(--muted);text-align:center}
.theme-t{flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="wrap">
  <header class="top">
    <div>
      <h1>오늘 뭐 먹지? <span class="berry">🍓</span></h1>
      <p class="sub">와이프 최애 메뉴 기준 · 수원 팔달구 출발 · 2인</p>
    </div>
    <button class="btn small ghost theme-t" id="themeBtn" type="button" aria-label="화면 테마 바꾸기">🌙</button>
  </header>

  <section class="panel" id="quiz" aria-labelledby="qTitle">
    <h2 id="qTitle">30초 질문</h2>
    <p class="wx" id="wx" hidden></p>
    <div id="questions"></div>
    <div class="recent" id="recentBox"></div>
  </section>

  <section class="panel" id="rouletteBox" hidden aria-live="polite">
    <div class="roulette">
      <div class="slot" id="slot">🍗 치킨</div>
      <div class="hint" id="slotHint">빙글빙글…</div>
    </div>
  </section>

  <section class="panel" id="result" hidden aria-labelledby="rTitle">
    <h2 id="rTitle">오늘의 후보</h2>
    <div class="cands" id="cands"></div>
    <button class="btn small ghost reroll" id="rerollBtn" type="button">🔄 다른 후보 3개</button>
    <details class="morebox" id="moreBox"><summary>메뉴 직접 고르기 <small>♥ 와이프 최애 · 🔥 요즘 뜸 · 🏯 전통</small></summary><div id="moreCats"></div></details>
  </section>

  <section class="panel" id="places" hidden aria-labelledby="pTitle">
    <div class="card-h">
      <h2 id="pTitle">맛집</h2>
      <button class="btn small ghost" id="ateBtn" type="button">이거 먹었어요</button>
    </div>
    <p class="hint" id="catDesc"></p>
    <div class="toggle"><button class="chip" id="openOnly" type="button" aria-pressed="true">지금 열린 곳만</button><span class="hint" id="openMsg"></span></div>
    <div class="rlist" id="rlist"></div>
    <div class="morefind" id="moreFind"></div>
  </section>

  <p class="dessert" id="dessert"></p>
</div>
<div class="actionbar">
  <div class="actions">
    <button class="btn" id="goBtn" type="button">메뉴 추천 받기</button>
    <button class="btn alt" id="randBtn" type="button">그냥 랜덤! 🎲</button>
  </div>
</div>

function applyTrends(t){
  if(!t||typeof t!=="object")return;TR=t;TREND={};TRAD={};
  (t.cats||[]).forEach(function(c){if(c&&c.id&&!CAT[c.id]&&Array.isArray(c.cuisine)){c.fav=0;CATS.push(c);CAT[c.id]=c;if(c.main)MAIN[c.id]=c.main;}});
  (t.trend||[]).forEach(function(x){if(CAT[x.cat])TREND[x.cat]=x;});
  (t.trad||[]).forEach(function(x){if(CAT[x.cat])TRAD[x.cat]=x;});
  var q=QS.filter(function(q){return q.k==="mood";})[0];if(q&&t.updatedAt)q.hint="요즘 뜨는 거는 "+t.updatedAt+" 기준, 매주 업데이트";
}

function renderRecent(){
  var box=$("recentBox"),list=loadRecent().filter(function(r){return daysAgo(r.t)<3;});
  if(!list.length){box.innerHTML='<span>최근 3일 동안 먹은 기록이 없어요.</span>';return;}
  var seen={},html='<span>최근 3일:</span>';
  list.slice().reverse().forEach(function(r){if(seen[r.c]||!CAT[r.c])return;seen[r.c]=1;
    var d=Math.floor(daysAgo(r.t));html+='<span class="tag">'+CAT[r.c].ico+' '+esc(CAT[r.c].name)+' · '+(d===0?'오늘':d+'일 전')+'</span>';});
  html+='<button class="linkish" id="clearRecent" type="button">기록 지우기</button>';
  box.innerHTML=html;
  $("clearRecent").addEventListener("click",function(){saveRecent([]);renderRecent();});
}

// ---- 영업시간 ----
var openOnly=true;
function hm(t){var a=t.split(":");return (+a[0])*60+(+a[1]);}
function openState(r,now){
  var h=r.hours;now=now||new Date();
  if(!h)return {k:"unknown",t:"영업시간 미확인"};
  var m=now.getHours()*60+now.getMinutes(),dow=now.getDay();
  function win(day){var w=(day===0||day===6)&&h.weekend?h.weekend:h;var o=hm(w.open),c=hm(w.close);if(c<=o)c+=1440;return {o:o,c:c,close:w.close,open:w.open};}
  var y=(dow+6)%7,wy=win(y);
  if(!(h.closed&&h.closed.indexOf(y)>=0)&&m+1440<wy.c)return {k:"open",t:"영업 중 · "+wy.close+"까지"};
  if(h.closed&&h.closed.indexOf(dow)>=0)return {k:"off",t:"오늘 휴무"};
  var w=win(dow);
  if(m>=w.o&&m<w.c){
    if(h.break){var b=h.break.split("-");if(m>=hm(b[0])&&m<hm(b[1]))return {k:"break",t:"브레이크 · "+b[1]+" 재오픈"};}
    return {k:"open",t:"영업 중 · "+w.close+"까지"};}
  if(m<w.o)return {k:"before",t:"영업 전 · "+w.open+" 오픈"};
  return {k:"shut",t:"오늘 영업 끝"};
}

function areaMin(r){return (AREA[r.area]||{min:30}).min;}
function inRange(r){return areaMin(r)<=MOVE_MAX[ans.move];}
function budgetLevel(){return {"1만원대":1,"2~3만원":2,"그 이상":3}[ans.budget];}
function scoreCat(c,recent){
  var s=c.fav,why=[],p;
  if(ans.mood==="와이프 최애"){if(c.fav>=FAV_MIN){s+=3;why.push("와이프 최애");}else s-=3;}
  else if(ans.mood==="요즘 뜨는 거"){if(TREND[c.id]){s+=7;why.push("요즘 뜨는 거");}else s-=2;}
  else if(ans.mood==="전통·수원 명물"){if(TRAD[c.id]){s+=7;why.push("전통 한 끼");}else s-=2;}
  else if(TREND[c.id]||TRAD[c.id])s+=1;
  if(ans.cuisine.length){
    if(c.cuisine.some(function(x){return ans.cuisine.indexOf(x)>=0;})){s+=4;why.push(ans.cuisine.filter(function(x){return c.cuisine.indexOf(x)>=0;})[0]);}
    else s-=8;
  }
  if(ans.soup==="국물!"){p=c.soup==="yes"?3:c.soup==="both"?1.5:-3;s+=p;if(p>0)why.push("국물");}
  else if(ans.soup==="안 국물"){p=c.soup==="no"?2:c.soup==="both"?1:-2;s+=p;if(p>0)why.push("안 국물");}
  var bl=budgetLevel();
  if(c.price.indexOf(bl)>=0){s+=2;why.push(ans.budget);}else{s-=1.5*Math.min.apply(null,c.price.map(function(x){return Math.abs(x-bl);}));}
  if(c.hunger.indexOf(ans.hunger)>=0){s+=2;why.push("배고픔 "+ans.hunger);}else s-=2;
  var n=DATA.filter(function(r){return r.category===c.id&&inRange(r);}).length;
  if(ans.move==="배달"){if(c.deliv){s+=3;why.push("배달");}else s-=4;}
  else if(n===0){s-=5;}else{s+=Math.min(n,3)*0.5;why.push(ans.move);}
  if(WX){
    if(WX.cold||WX.rain){p=c.soup==="yes"?2.5:c.soup==="both"?1:0;if(p){s+=p;why.push(WX.rain?"비 와서 국물":"쌀쌀해서 국물");}}
    else if(WX.hot&&["noodle","yukhoe","poke","hoe"].indexOf(c.id)>=0){s+=2;why.push("더워서 시원한 거");}
  }
  if(recent[c.id]){s-=6;}
  var openN=DATA.filter(function(r){return r.category===c.id&&(ans.move==="배달"||inRange(r))&&isOpen(r);}).length;
  if(openN===0){s-=8;}
  if(yest()[c.id]){s-=12;}
  if(yestBig()[c.id]){s-=5;}
  s+=Math.random()*1.2;
  return {c:c,s:s,why:why,recent:!!recent[c.id],yest:!!yest()[c.id],yb:!!yestBig()[c.id],closedNow:openN===0};
}

      WX={t:t,rain:rain,cold:t<10,hot:t>=27};

var current=null;
function showCands(list){
  var y=list.filter(function(x){return !x.yest;});if(y.length>=3)list=y;
  // 고른 종류마다 후보가 최소 1개는 들어가게
  if(ans.cuisine.length>1){
    var top=list.slice(0,3),rest=list.slice(3);
    ans.cuisine.forEach(function(k){
      if(top.some(function(x){return x.c.cuisine.indexOf(k)>=0;}))return;
      var i=rest.findIndex(function(x){return x.c.cuisine.indexOf(k)>=0&&!x.yest;});if(i<0)return;
      var cnt={};top.forEach(function(x){x.c.cuisine.forEach(function(q){if(ans.cuisine.indexOf(q)>=0)cnt[q]=(cnt[q]||0)+1;});});
      for(var j=top.length-1;j>=0;j--){var ok=top[j].c.cuisine.every(function(q){return ans.cuisine.indexOf(q)<0||cnt[q]>1;});
        if(ok){rest.push(top[j]);top[j]=rest.splice(i,1)[0];break;}}
    });
    list=top.concat(rest);
  }
  $("rouletteBox").hidden=true;
  var box=$("cands");box.innerHTML="";
  var shown=list.slice(0,3);
  if(ans.cuisine.length&&!list[0].roul){
    var m=list.filter(function(x){return x.c.cuisine.some(function(q){return ans.cuisine.indexOf(q)>=0;});});
    if(m.length){shown=m.slice(0,3);list=m.concat(list.filter(function(x){return m.indexOf(x)<0;}));}
  }
  // 후보 구성: 와이프 최애 2개 먼저 + 조건 맞는 다른 인기 메뉴 1개 (없으면 점수순으로 채움)
  if(!list[0].roul&&ans.mood!=="골고루"){
    var ok0=function(x){return !x.yest&&!x.closedNow&&(!ans.cuisine.length||x.c.cuisine.some(function(q){return ans.cuisine.indexOf(q)>=0;}));};
    var want=function(x){return ans.mood==="와이프 최애"?x.c.fav>=FAV_MIN:ans.mood==="요즘 뜨는 거"?!!TREND[x.c.id]:!!TRAD[x.c.id];};
    var pk=list.filter(function(x){return want(x)&&ok0(x);});
    list.forEach(function(x){if(pk.length<3&&pk.indexOf(x)<0&&ok0(x))pk.push(x);});
    if(pk.length)shown=pk.slice(0,3);
  }
  else if(!list[0].roul){
    var ok=function(x){return !x.yest&&!x.closedNow&&(!ans.cuisine.length||x.c.cuisine.some(function(q){return ans.cuisine.indexOf(q)>=0;}));};
    var favs=list.filter(function(x){return x.c.fav>=FAV_MIN&&ok(x);}).slice(0,2);
    var oth=list.filter(function(x){return x.c.fav<FAV_MIN&&ok(x);});
    // 여러 종류 골랐으면 아직 안 나온 종류 먼저
    var miss=ans.cuisine.filter(function(q){return !favs.some(function(x){return x.c.cuisine.indexOf(q)>=0;});});
    if(miss.length)oth.sort(function(a,b){var ma=a.c.cuisine.some(function(q){return miss.indexOf(q)>=0;}),mb=b.c.cuisine.some(function(q){return miss.indexOf(q)>=0;});return (mb-ma)||(b.s-a.s);});
    // 새 메뉴 자리는 비슷한 점수끼리 돌아가며 (늘 같은 게 안 뜨게)
    if(oth.length>1&&favs.length>=2&&!miss.length){var top=oth.filter(function(x){return x.s>=oth[0].s-2.5;}).slice(0,4);var r=top[Math.floor(Math.random()*top.length)];oth=[r].concat(oth.filter(function(x){return x!==r;}));}
    var pick3=favs.concat(oth.slice(0,3-favs.length));
    oth.slice(0,3-favs.length).forEach(function(x){if(favs.length)x.fresh=true;});
    list.forEach(function(x){if(pick3.length<3&&pick3.indexOf(x)<0&&!x.yest&&(!ans.cuisine.length||ok(x)||!x.closedNow&&false))pick3.push(x);});
    if(pick3.length)shown=pick3.slice(0,3);
  }
  shown.forEach(function(x,i){
    var b=document.createElement("button");b.type="button";b.className="cand";b.id="cand-"+x.c.id;
    var tw=TREND[x.c.id]||TRAD[x.c.id];
    var why=(x.why.length?x.why.slice(0,3).join(" + "):(x.c.fav>=FAV_MIN?"와이프 최애":"인기 메뉴"))+" → "+(tw?tw.why:x.c.name);
    if(x.fresh)why="새로운 거 하나 · "+why;
    if(x.closedNow)why+=" (지금 연 곳 없음)";
    if(x.yest)why+=" (어제 먹은 메뉴)";else if(x.yb)why+=" (어제 "+MAIN[x.c.id]+" 먹어서 감점)";else if(x.recent)why+=" (최근에 먹어서 감점)";
    else if(i===0&&(Object.keys(yest()).length||Object.keys(yestBig()).length))why+=" · 어제 먹은 건 뺐어요";
    b.innerHTML='<span class="ico" aria-hidden="true">'+x.c.ico+'</span><span style="min-width:0"><span class="nm">'+esc(x.c.name)+'</span>'+(x.c.fav>=FAV_MIN?' <span class="heart">♥ 와이프 최애</span>':'')+(TREND[x.c.id]?' <span class="heart tr">🔥 요즘 뜸</span>':'')+(TRAD[x.c.id]?' <span class="heart td">🏯 전통</span>':'')+'<br><span class="why">'+esc(why)+'</span></span><span class="rank">'+(i+1)+'위</span>';
    b.addEventListener("click",function(){pick(x.c.id);});
    box.appendChild(b);
  });
  // 최애 아닌 인기 메뉴도 고를 수 있게 칩으로
  shownNow=shown.map(function(x){return x.c.id;});
  renderAllMenus();
  $("result").hidden=false;
  var left=rank().filter(function(x){return !x.yest&&shownNow.indexOf(x.c.id)<0;}).length;$("rerollBtn").textContent=left<3?"🔄 처음부터 다시":"🔄 다른 후보 3개";
  pick(shown[0].c.id);
}

function fmtKm(r){
  var lat=r.lat,lng=r.lng,tag="";
  
  if(lat==null)return null;
  var R=6371,dLa=(lat-BASE.lat)*Math.PI/180,dLo=(lng-BASE.lng)*Math.PI/180;
  var a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(BASE.lat*Math.PI/180)*Math.cos(lat*Math.PI/180)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return "직선 약 "+(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))).toFixed(1)+"km"+tag;
}

function roulette(){
  var rc=recentWithin3(),yy=yest(),yb=yestBig(),pool=CATS.filter(function(c){return !rc[c.id]&&!yy[c.id]&&!yb[c.id];});
  if(pool.length<2)pool=CATS.filter(function(c){return !yy[c.id];});if(!pool.length)pool=CATS;
  var target=pool[Math.floor(Math.random()*pool.length)];
  $("rouletteBox").hidden=false;$("result").hidden=true;$("places").hidden=true;
  var slot=$("slot"),i=0,steps=16+Math.floor(Math.random()*5),delay=40;
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce)steps=1;
  slot.classList.add("spin");$("slotHint").textContent="빙글빙글…";
  (function tick(){
    var c=i>=steps-1?target:CATS[i%CATS.length];
    slot.textContent=c.ico+" "+c.name;i++;
    if(i<steps){delay*=1.1;setTimeout(tick,delay);}
    else{slot.classList.remove("spin");$("slotHint").textContent="오늘은 이거! (어제·최근 3일 먹은 메뉴는 빼고 돌렸어요)";
      var rest=rank().filter(function(x){return x.c.id!==target.id;});
      showCands([{c:target,s:0,why:["룰렛"],recent:false,yest:false,roul:true}].concat(rest));
      $("rouletteBox").hidden=false;}
  })();
}

var DESSERTS=["후식은 딸기 🍓 (최애)","후식은 귤·한라봉·레드향 🍊","후식은 베리 한 접시 🫐","후식은 달달한 거 아무거나 🍰","아침이라면 사과 🍎 (퍽퍽한 사과는 절대 금지)","입가심 감귤주스 🧃"];

// 시작: restaurants.json이 같은 폴더에 있으면 그걸 우선 사용
function prefillYesterday(){
  var d=new Date();d.setHours(0,0,0,0);var start=d.getTime()-86400000,end=d.getTime();
  loadRecent().forEach(function(r){if(r.t>=start&&r.t<end&&CAT[r.c]){var eq=Object.keys(BIG_EQ).filter(function(k){return BIG_EQ[k].indexOf(r.c)>=0;})[0];var l=eq||(CAT[r.c].fav>=FAV_MIN?CAT[r.c].ico+" "+CAT[r.c].short:MAIN[r.c]);if(!l)return;if(ans.yesterday.indexOf(l)<0)ans.yesterday.push(l);}});
}
function boot(){prefillYesterday();renderQuestions();renderRecent();showCands(rank());loadWeather();}
try{
  var get=function(u){return fetch(u,{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json();}).catch(function(){return null;});};
  Promise.all([get("restaurants.json"),get("trends.json")]).then(function(v){
    if(Array.isArray(v[0])&&v[0].length)DATA=v[0];
    if(v[1]&&v[1].updatedAt)applyTrends(v[1]);
  }).catch(function(){}).then(boot);
}catch(e){boot();}
})();
